server:
  port: 8080

spring:
  application:
    name: mercado-x-core
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:postgresql://localhost:5432/mercado_x
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        lob:
          non_contextual_creation: true
  flyway:
    enabled: true
    schemas: auth,core,invoicing,ai
    default-schema: auth
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: core-service-group
    listener:
      missing-topics-fatal: false

kafka:
  schema-registry-url: ${SCHEMA_REGISTRY_URL:http://localhost:8085}

security:
  jwt:
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:./secrets/public.pem}

encryption:
  master-key:
    value: ${ENCRYPTION_MASTER_KEY}

leads:
  ratelimit:
    max-body-bytes: 8192
    ip:
      max-requests: 5
      window-seconds: 60
    org:
      max-requests: 20
      window-seconds: 60

logging:
  level:
    org.hibernate: DEBUG

